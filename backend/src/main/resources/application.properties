spring.application.name=personal-finance-manager
server.port=8080

# MySQL: create the database first ->  CREATE DATABASE finance_db;
spring.datasource.url=jdbc:mysql://localhost:3306/finance_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.cors.allowed-origin=http://localhost:5173

# JWT (override JWT_SECRET in production; must be at least 32 characters)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-hours=24
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
